services:
  - type: web
    name: uptilll
    runtime: node
    region: oregon
    plan: starter          # $7/mo — never sleeps (POS must always be on)
    rootDir: .
    buildCommand: npm ci && npm run build --workspace=frontend && npm run build --workspace=backend
    startCommand: npm run db:migrate:deploy --workspace=backend && npm run start --workspace=backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true        # Render generates a secure random value
      - key: CORS_ORIGIN
        value: https://uptilll.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: uptilll-db
          property: connectionString
      # REDIS_URL is optional — app falls back to in-memory if not set
      # Add it later from a Redis provider (Upstash free tier works)

databases:
  - name: uptilll-db
    databaseName: uptilll
    region: oregon
    plan: starter          # $7/mo — production-grade, no 90-day expiry
